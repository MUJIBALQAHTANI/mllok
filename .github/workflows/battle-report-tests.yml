name: Battle simulator verification
on:
  push:
    branches: [simulator-reports-v2]
    paths: ['battle-simulator/**', '.github/workflows/battle-report-tests.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine and privacy tests
        run: |
          mkdir -p battle-simulator/docs
          set -o pipefail
          node --test battle-simulator/test.mjs | tee battle-simulator/docs/engine-test.txt
      - name: Verify published Render assets
        env:
          PUBLIC_SIMULATOR_URL: https://glorykings-battle-simulator.onrender.com
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const results=[];
          for(const name of ['index.html','style.css','engine.mjs','ui.mjs']) {
            const url=process.env.PUBLIC_SIMULATOR_URL+'/'+(name==='index.html'?'':name);
            const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw Error('Published asset HTTP '+response.status+': '+name);
            const bytes=Buffer.from(await response.arrayBuffer());
            const expected=hash(await readFile('battle-simulator/'+name));
            const actual=hash(bytes);
            if(actual!==expected)throw Error('Published asset does not match checked source: '+name);
            results.push({name,url:response.url,httpStatus:response.status,sha256:actual,sourceMatches:true});
          }
          await writeFile('battle-simulator/docs/published-assets.json',JSON.stringify({status:'PASS',verifiedAt:new Date().toISOString(),results},null,2));
          console.log('PUBLISHED_ASSETS_PASS 4/4');
          JS
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Mobile browser and sharing tests
        env:
          PUBLIC_SIMULATOR_URL: https://glorykings-battle-simulator.onrender.com
        run: node battle-simulator/browser.test.mjs
      - name: Capture source provenance
        if: always()
        run: |
          git rev-parse HEAD > battle-simulator/docs/source-commit.txt
          sha256sum battle-simulator/engine.mjs battle-simulator/ui.mjs battle-simulator/style.css battle-simulator/index.html > battle-simulator/docs/source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glorykings-battle-simulator-evidence
          path: battle-simulator/
          retention-days: 14
